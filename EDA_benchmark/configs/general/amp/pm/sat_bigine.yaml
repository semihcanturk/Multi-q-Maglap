# SAT, structure extractor BIGINE (bidirected GIN with edge features), AMP / PM.
# Hyperparameters from the paper's table "Hyperparameter for SAT (each layer uses
# bidirected GIN as kernel) on Open Circuit Benchmark" (arXiv:2407.20912, App. B):
# 3-layer SAT, 1-hop extractor, hidden 54, batch 64, lr 0.00117,
# dropout 0.2, 200 epochs, multi-q = (1/100, ..., 5/100).
# Not in the paper, so set here: num_heads 2 (the largest head count dividing both
# hidden_dim and hidden_dim + 10, its width once a node PE is concatenated), a
# 3-layer output MLP, and the StepLR schedule of the GIN configs.
#
# GINE needs edge_attr, which AMP graphs only get from an edge-level PE
# (pe_strategy invariant_fixed), e.g. lap10/lap_n_spe_e_spe,
# maglap10/maglap_5q001_n_spe_e_spe, pathlap10/pathlap_n_spe_e_spe. For No PE and
# node-only PEs (SignNet: lap10/lap_gnn, maglap10/maglap_5q001_gnn) use
# sat_bigin.yaml.

utils:
  seed: 123
  torch_num_threads: 10

task:
  name: 'AMP'
  type: AMP # type: cdfg or dfg
  target: pm # different target prediction
  processed_folder: './data_processed/'
  divide_seed: default #set as default or a seed
  raw_data_path: './data_raw/AMP/'
  data_processor: AMPDataProcessor
  train_stage_num: 3

train:
  batch_size: 64
  epoch: 200
  optimizer: Adam
  scheduler:
    name: StepLR
    step_size: 100
    gamma: 0.95
  lr : 0.00117
  criterion: MSE
  wandb: 0
  train_files: './train_files/'
  directed: 1

model:
  name: SAT
  inner_gnn: BIGINE # structure-extractor GNN: GIN | GINE (undirected), BIGIN | BIGINE (bidirected)
  k_hop: 1 # GNN layers in each SAT layer's structure extractor
  num_heads: 2
  hidden_dim: 54
  num_layers: 3
  node_input_dim: 7
  edge_input_dim: 2
  dropout: 0.2
  mlp_out:
    num_layer: 3
