# No-PE baseline: same backbone/hyperparameters as gine_10q001.yaml, but run
# without any positional encoding (no --pe_config). AMP graphs carry no edge
# features of their own -- with a PE, the edge input to GINE/BIGINE is built
# from the PE (MiddleModel.invariant_fixed_forward) -- so the PE-free baseline
# uses the edge-attribute-free conv (GIN) instead of GINE.

utils:
  seed: 123
  torch_num_threads: 10

task:
  name: 'AMP'
  type: AMP # type: cdfg or dfg
  target: gain # different target prediction
  processed_folder: './data_processed/'
  divide_seed: default #set as default or a seed
  raw_data_path: './data_raw/AMP/'
  data_processor: AMPDataProcessor
  train_stage_num: 3

train:
  batch_size: 128
  epoch: 300
  optimizer: Adam
  scheduler: 
    name: StepLR
    step_size: 100
    gamma: 0.95
  lr : 0.0067
  criterion: MSE
  wandb: 0
  train_files: './train_files/'
  directed: 0

model: 
  name: GIN
  hidden_dim: 96
  num_layers: 4
  node_input_dim: 7
  edge_input_dim: 2
  dropout: 0.1
  mlp_out:
    num_layer: 3
  pe_file_name: no_pe
